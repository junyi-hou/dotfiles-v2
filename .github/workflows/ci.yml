name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install direnv
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get install -y direnv
          else
            brew install direnv
          fi

      - name: Cache environment
        uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            .pixi
            .tools
            ~/.opencode
            ~/.local/bin/opencode
          key: dotfiles-env-${{ matrix.os }}-${{ hashFiles('pixi.toml', 'pixi.lock', '.envrc') }}
          restore-keys: |
            dotfiles-env-${{ matrix.os }}-

      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > setup.env
          # .envrc only activates 'dev'; also add 'all' for Node.js
          echo "PATH=$PWD/.pixi/envs/all/bin:$PATH" >> setup.env
          echo "$PWD/.pixi/envs/all/bin" > setup.path

      - name: Save environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-env-${{ matrix.os }}
          path: |
            setup.env
            setup.path

  emacs-integration-test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore environment
        uses: actions/cache/restore@v4
        with:
          path: |
            .pixi
            .tools
            ~/.opencode
            ~/.local/bin/opencode
          key: dotfiles-env-${{ matrix.os }}-${{ hashFiles('pixi.toml', 'pixi.lock', '.envrc') }}
          restore-keys: |
            dotfiles-env-${{ matrix.os }}-

      - name: Download environment artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-env-${{ matrix.os }}
          path: setup-env

      - name: Load environment variables
        run: |
          cat setup-env/setup.env >> "$GITHUB_ENV"
          cat setup-env/setup.path >> "$GITHUB_PATH"

      - name: Run install script
        run: make install

      - name: Build emacs
        run: make build

      - name: Verify Emacs installation
        run: |
          $HOME/.local/bin/emacs --version
          test -x "$HOME/.local/bin/emacsclient"
          $HOME/.local/bin/emacsclient --version

      - name: Run Emacs tests
        run: make test-emacs

  scripts-unit-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: make test

  install-dotfiles-integration-test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore environment
        uses: actions/cache/restore@v4
        with:
          path: |
            .pixi
            .tools
            ~/.opencode
            ~/.local/bin/opencode
          key: dotfiles-env-${{ matrix.os }}-${{ hashFiles('pixi.toml', 'pixi.lock', '.envrc') }}
          restore-keys: |
            dotfiles-env-${{ matrix.os }}-

      - name: Download environment artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-env-${{ matrix.os }}
          path: setup-env

      - name: Load environment variables
        run: |
          cat setup-env/setup.env >> "$GITHUB_ENV"
          cat setup-env/setup.path >> "$GITHUB_PATH"

      - name: Run dotfiles install script
        run: make install

      - name: Verify dotfiles installation
        run: |
          test -L "$HOME/dotfiles-v2"
          test -L "$HOME/.gitconfig"

  install-java-integration-test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore environment
        uses: actions/cache/restore@v4
        with:
          path: |
            .pixi
            .tools
            ~/.opencode
            ~/.local/bin/opencode
          key: dotfiles-env-${{ matrix.os }}-${{ hashFiles('pixi.toml', 'pixi.lock', '.envrc') }}
          restore-keys: |
            dotfiles-env-${{ matrix.os }}-

      - name: Download environment artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-env-${{ matrix.os }}
          path: setup-env

      - name: Load environment variables
        run: |
          cat setup-env/setup.env >> "$GITHUB_ENV"
          cat setup-env/setup.path >> "$GITHUB_PATH"

      - name: Run Java install script
        run: make java

      - name: Verify Java installation
        run: .tools/java/bin/java --version

  install-agent-integration-test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore environment
        uses: actions/cache/restore@v4
        with:
          path: |
            .pixi
            .tools
            ~/.opencode
            ~/.local/bin/opencode
          key: dotfiles-env-${{ matrix.os }}-${{ hashFiles('pixi.toml', 'pixi.lock', '.envrc') }}
          restore-keys: |
            dotfiles-env-${{ matrix.os }}-

      - name: Download environment artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-env-${{ matrix.os }}
          path: setup-env

      - name: Load environment variables
        run: |
          cat setup-env/setup.env >> "$GITHUB_ENV"
          cat setup-env/setup.path >> "$GITHUB_PATH"

      - name: Verify agent installation
        run: |
          command -v opencode
